info:
  name: QUERY is not supported (405)
  type: http
  seq: 8

http:
  method: QUERY
  url: "{{baseUrl}}/plays"
  headers:
    - name: Content-Type
      value: text/plain
  body:
    type: text
    data: count(*)

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "405"
    - expression: res.headers['allow']
      operator: notContains
      value: QUERY

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
