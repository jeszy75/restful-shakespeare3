info:
  name: String
  type: http
  seq: 2

http:
  method: QUERY
  url: "{{baseUrl}}/plays/macbeth/acts/3"
  headers:
    - name: Content-Type
      value: text/plain
  body:
    type: text
    data: string(TITLE)

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: contains
      value: type="string">ACT III</r:results>

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
