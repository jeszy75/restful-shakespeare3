info:
  name: Play
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/plays/macbeth"

runtime:
  scripts:
    - type: tests
      code: |-
        const link = res.getHeader("link");

        test("links to /plays/macbeth (self)", function() {
          expect(link).to.include('</plays/macbeth>; rel="self"');
        });

        test("links to /plays (up)", function() {
          expect(link).to.include('</plays>; rel="up"');
        });

        test("links to /plays/macbeth/acts/1 (item)", function() {
          expect(link).to.include('</plays/macbeth/acts/1>; rel="item"');
        });

        test("links to /plays/macbeth/acts/5 (item)", function() {
          expect(link).to.include('</plays/macbeth/acts/5>; rel="item"');
        });

        test("links to /plays/macbeth/bookmark (tag:inf.unideb.hu,2026:restful-shakespeare/rels/bookmark)", function() {
          expect(link).to.include('</plays/macbeth/bookmark>; rel="tag:inf.unideb.hu,2026:restful-shakespeare/rels/bookmark"');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: application/xml
    - expression: res.headers['accept-query']
      operator: eq
      value: text/plain

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: A play links to its acts (`item`) and to the URI where it can be bookmarked (an extension link relation type). `Accept-Query` advertises the QUERY method.
