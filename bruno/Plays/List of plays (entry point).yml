info:
  name: List of plays (entry point)
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/plays"

runtime:
  scripts:
    - type: tests
      code: |-
        const link = res.getHeader("link");

        test("links to /plays (self)", function() {
          expect(link).to.include('</plays>; rel="self"');
        });

        test("links to /plays/macbeth (item)", function() {
          expect(link).to.include('</plays/macbeth>; rel="item"');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: application/xml
    - expression: res.body
      operator: contains
      value: <TITLE>The Tragedy of Macbeth</TITLE>

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: The entry point of the API. Every play is linked with the `item` link relation type.
