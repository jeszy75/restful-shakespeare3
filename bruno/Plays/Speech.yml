info:
  name: Speech
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/plays/macbeth/acts/1/scenes/1/speeches/1"

runtime:
  scripts:
    - type: tests
      code: |-
        const link = res.getHeader("link");

        test("links to /plays/macbeth/acts/1/scenes/1 (up)", function() {
          expect(link).to.include('</plays/macbeth/acts/1/scenes/1>; rel="up"');
        });

        test("links to /plays/macbeth/acts/1/scenes/1/speeches/2 (next)", function() {
          expect(link).to.include('</plays/macbeth/acts/1/scenes/1/speeches/2>; rel="next"');
        });

        test("has no item link", function() {
          expect(link).to.not.include('rel="item"');
        });

        test("has no prev link", function() {
          expect(link).to.not.include('rel="prev"');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: contains
      value: <SPEAKER>First Witch</SPEAKER>

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Speeches have no children, so there are no `item` links.
