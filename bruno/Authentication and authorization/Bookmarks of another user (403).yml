info:
  name: Bookmarks of another user (403)
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/users/{{otherUser}}/bookmarks"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // The other one of the two users of the API
        bru.setVar("otherUser", bru.getEnvVar("username") === "alice" ? "bob" : "alice");
  assertions:
    - expression: res.status
      operator: eq
      value: "403"
    - expression: res.headers['content-type']
      operator: contains
      value: application/problem+xml
    - expression: res.body
      operator: contains
      value: <status>403</status>

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Authenticated, but users can access their own bookmarks only.
