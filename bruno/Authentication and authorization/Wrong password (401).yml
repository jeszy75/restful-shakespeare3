info:
  name: Wrong password (401)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/users/{{username}}/bookmarks"
  auth:
    type: basic
    username: "{{username}}"
    password: wrong-password

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.headers['content-type']
      operator: contains
      value: application/problem+xml
    - expression: res.body
      operator: contains
      value: <status>401</status>

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
