info:
  name: Without credentials (401)
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/plays/macbeth/acts/1/scenes/3/bookmark"
  headers:
    - name: Content-Type
      value: text/plain
  body:
    type: text
    data: No credentials

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.headers['content-type']
      operator: contains
      value: application/problem+xml
    - expression: res.body
      operator: contains
      value: <status>401</status>
    - expression: res.headers['www-authenticate']
      operator: startsWith
      value: Basic

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "No authentication (`auth: none`). Browsers show a login dialog because of `WWW-Authenticate`."
