info:
  name: Unsupported method (405)
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/plays/macbeth"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "405"
    - expression: res.headers['content-type']
      operator: contains
      value: application/problem+xml
    - expression: res.body
      operator: contains
      value: <status>405</status>
    - expression: res.headers['allow']
      operator: contains
      value: GET

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
