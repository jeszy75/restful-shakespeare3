info:
  name: Nonexistent play (404)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/plays/othello"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.headers['content-type']
      operator: contains
      value: application/problem+xml
    - expression: res.body
      operator: contains
      value: <status>404</status>
    - expression: res.body
      operator: contains
      value: <instance>/plays/othello</instance>

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
