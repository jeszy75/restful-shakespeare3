info:
  name: Non-numeric act number (400)
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/plays/macbeth/acts/three"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.headers['content-type']
      operator: contains
      value: application/problem+xml
    - expression: res.body
      operator: contains
      value: <status>400</status>

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
