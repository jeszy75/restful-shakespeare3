info:
  name: Security headers of errors
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/sonnets"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.headers['content-security-policy']
      operator: eq
      value: default-src 'none'; frame-ancestors 'none'
    - expression: res.headers['x-content-type-options']
      operator: eq
      value: nosniff

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
