info:
  name: Cross-origin request
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/plays/macbeth"
  headers:
    - name: Origin
      value: https://example.org

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['access-control-allow-origin']
      operator: eq
      value: "*"
    - expression: res.headers['access-control-expose-headers']
      operator: contains
      value: Link
    - expression: res.headers['access-control-expose-headers']
      operator: contains
      value: Location

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "`Link`, `Accept-Query` and `Location` must be exposed, otherwise scripts cannot read them."
