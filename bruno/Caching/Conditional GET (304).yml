info:
  name: Conditional GET (304)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/plays/macbeth/acts/1"
  headers:
    - name: If-Modified-Since
      value: "{{lastModified}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "304"
    - expression: res.body
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Run *Get the validator* first.
