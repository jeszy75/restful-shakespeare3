info:
  name: Get the validator
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/plays/macbeth/acts/1"

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("lastModified", res.getHeader("last-modified"));
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['cache-control']
      operator: isDefined
    - expression: res.headers['last-modified']
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Saves the value of `Last-Modified` into the `lastModified` runtime variable.
