info:
  name: Get the changed bookmark
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}{{bookmarkUri}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: contains
      value: <note>All hail, Macbeth, that shalt be king hereafter!</note>

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
