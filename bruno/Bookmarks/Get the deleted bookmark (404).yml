info:
  name: Get the deleted bookmark (404)
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}{{bookmarkUri}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.headers['content-type']
      operator: contains
      value: application/problem+xml
    - expression: res.body
      operator: contains
      value: <status>404</status>

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
