info:
  name: List the bookmarks
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/users/{{username}}/bookmarks"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("links to the new bookmark", function() {
          expect(res.getHeader("link")).to.include(`<${bru.getVar("bookmarkUri")}>; rel="item"`);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: application/xml
    - expression: res.body
      operator: startsWith
      value: <bookmarks>

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
